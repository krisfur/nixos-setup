# ThinkPad P14s speaker DSP, replacing EasyEffects with the same plugins.
#
# Generated from config/easyeffects/thinkpad-unsuck.json. EasyEffects does no
# DSP of its own: it hosts these LV2 plugins through lilv, so driving them here
# is the identical signal path minus the Qt process. Verified by null test
# against the running EasyEffects chain: -87 dB residual, gain factor 1.000000.
#
# Port names, dB->linear conversions and enum orderings come from the
# EasyEffects sources (src/*.cpp BIND_LV2_PORT* and src/contents/kcfg/*.kcfg).
# Per-plugin input/output gain is applied by EasyEffects outside the plugin
# (plugin_base.cpp), hence the explicit `linear` gain nodes rather than the
# plugins' own level ports.
#
# nofail: a broken graph must not take the audio daemon down with it.
context.modules = [
  { name = libpipewire-module-filter-chain
    flags = [ nofail ]
    args = {
      node.description = "ThinkPad Speaker DSP"
      media.name       = "ThinkPad Speaker DSP"
      filter.graph = {
        nodes = [
          # EasyEffects leaves the sidechain probe ports unlinked, which hands
          # the plugins a zeroed dummy buffer (plugin_base.cpp). Mult = 0
          # reproduces that, and keeps sc_* from becoming stray graph inputs.
          { type = builtin name = zero label = linear control = { "Mult" = 0.0 } }
          { type = lv2 name = filter plugin = "http://lsp-plug.in/plugins/lv2/filter_stereo" label = filter
            control = { "bal" = 0.000000000 "decramp" = 0.000000000 "f" = 140.000000000 "fm" = 0.000000000 "ft" = 1.000000000 "g" = 1.000000000 "mode" = 0.000000000 "q" = 0.000000000 "s" = 2.000000000 "w" = 4.000000000 } }
          { type = builtin name = bass_enhancer_ig_l label = linear control = { "Mult" = 0.501187234 } }
          { type = builtin name = bass_enhancer_ig_r label = linear control = { "Mult" = 0.501187234 } }
          { type = lv2 name = bass_enhancer plugin = "http://calf.sourceforge.net/plugins/BassEnhancer" label = bass_enhancer
            control = { "amount" = 12.589254118 "blend" = 0.000000000 "drive" = 10.000000000 "floor" = 10.000000000 "floor_active" = 1.000000000 "freq" = 200.000000000 "listen" = 0.000000000 } }
          { type = lv2 name = multiband_compressor plugin = "http://lsp-plug.in/plugins/lv2/sc_mb_compressor_stereo" label = multiband_compressor
            control = { "al_0" = 0.158489319 "al_1" = 0.063095734 "al_2" = 0.063095734 "al_3" = 0.063095734 "al_4" = 0.251188643 "al_5" = 0.251188643 "al_6" = 0.251188643 "al_7" = 0.251188643 "at_0" = 150.000000000 "at_1" = 150.000000000 "at_2" = 100.000000000 "at_3" = 80.000000000 "at_4" = 20.000000000 "at_5" = 20.000000000 "at_6" = 20.000000000 "at_7" = 20.000000000 "bm_0" = 0.000000000 "bm_1" = 0.000000000 "bm_2" = 0.000000000 "bm_3" = 0.000000000 "bm_4" = 0.000000000 "bm_5" = 0.000000000 "bm_6" = 0.000000000 "bm_7" = 0.000000000 "bs_0" = 0.000000000 "bs_1" = 0.000000000 "bs_2" = 0.000000000 "bs_3" = 0.000000000 "bs_4" = 0.000000000 "bs_5" = 0.000000000 "bs_6" = 0.000000000 "bs_7" = 0.000000000 "bsa_0" = 1.995262315 "bsa_1" = 1.995262315 "bsa_2" = 1.995262315 "bsa_3" = 1.995262315 "bsa_4" = 1.995262315 "bsa_5" = 1.995262315 "bsa_6" = 1.995262315 "bsa_7" = 1.995262315 "bth_0" = 0.000251189 "bth_1" = 0.000251189 "bth_2" = 0.000251189 "bth_3" = 0.000251189 "bth_4" = 0.000251189 "bth_5" = 0.000251189 "bth_6" = 0.000251189 "bth_7" = 0.000251189 "cbe_1" = 1.000000000 "cbe_2" = 1.000000000 "cbe_3" = 1.000000000 "cbe_4" = 0.000000000 "cbe_5" = 0.000000000 "cbe_6" = 0.000000000 "cbe_7" = 0.000000000 "ce_0" = 1.000000000 "ce_1" = 1.000000000 "ce_2" = 1.000000000 "ce_3" = 1.000000000 "ce_4" = 1.000000000 "ce_5" = 1.000000000 "ce_6" = 1.000000000 "ce_7" = 1.000000000 "cm_0" = 0.000000000 "cm_1" = 0.000000000 "cm_2" = 0.000000000 "cm_3" = 0.000000000 "cm_4" = 0.000000000 "cm_5" = 0.000000000 "cm_6" = 0.000000000 "cm_7" = 0.000000000 "cr_0" = 5.000000000 "cr_1" = 3.000000000 "cr_2" = 3.000000000 "cr_3" = 4.000000000 "cr_4" = 1.000000000 "cr_5" = 1.000000000 "cr_6" = 1.000000000 "cr_7" = 1.000000000 "envb" = 0.000000000 "g_dry" = 0.000099885 "g_wet" = 1.000000000 "in2lk" = 1.000000000 "in2sc" = 1.000000000 "kn_0" = 0.251188643 "kn_1" = 0.354813389 "kn_2" = 0.354813389 "kn_3" = 0.354813389 "kn_4" = 0.501187234 "kn_5" = 0.501187234 "kn_6" = 0.501187234 "kn_7" = 0.501187234 "lk2in" = 1.000000000 "lk2sc" = 1.000000000 "mk_0" = 1.584893192 "mk_1" = 1.412537545 "mk_2" = 1.412537545 "mk_3" = 1.584893192 "mk_4" = 1.000000000 "mk_5" = 1.000000000 "mk_6" = 1.000000000 "mk_7" = 1.000000000 "mode" = 1.000000000 "rrl_0" = 0.000099885 "rrl_1" = 0.000099885 "rrl_2" = 0.000099885 "rrl_3" = 0.000099885 "rrl_4" = 0.000099885 "rrl_5" = 0.000099885 "rrl_6" = 0.000099885 "rrl_7" = 0.000099885 "rt_0" = 300.000000000 "rt_1" = 200.000000000 "rt_2" = 150.000000000 "rt_3" = 120.000000000 "rt_4" = 100.000000000 "rt_5" = 100.000000000 "rt_6" = 100.000000000 "rt_7" = 100.000000000 "sc2in" = 1.000000000 "sc2lk" = 1.000000000 "sce_0" = 0.000000000 "sce_1" = 0.000000000 "sce_2" = 0.000000000 "sce_3" = 0.000000000 "sce_4" = 0.000000000 "sce_5" = 0.000000000 "sce_6" = 0.000000000 "sce_7" = 0.000000000 "schc_0" = 0.000000000 "schc_1" = 0.000000000 "schc_2" = 0.000000000 "schc_3" = 0.000000000 "schc_4" = 0.000000000 "schc_5" = 0.000000000 "schc_6" = 0.000000000 "schc_7" = 0.000000000 "schf_0" = 500.000000000 "schf_1" = 1000.000000000 "schf_2" = 2000.000000000 "schf_3" = 4000.000000000 "schf_4" = 8000.000000000 "schf_5" = 12000.000000000 "schf_6" = 16000.000000000 "schf_7" = 20000.000000000 "sclc_0" = 0.000000000 "sclc_1" = 0.000000000 "sclc_2" = 0.000000000 "sclc_3" = 0.000000000 "sclc_4" = 0.000000000 "sclc_5" = 0.000000000 "sclc_6" = 0.000000000 "sclc_7" = 0.000000000 "sclf_0" = 10.000000000 "sclf_1" = 500.000000000 "sclf_2" = 1000.000000000 "sclf_3" = 2000.000000000 "sclf_4" = 4000.000000000 "sclf_5" = 8000.000000000 "sclf_6" = 12000.000000000 "sclf_7" = 16000.000000000 "scm_0" = 1.000000000 "scm_1" = 1.000000000 "scm_2" = 1.000000000 "scm_3" = 1.000000000 "scm_4" = 1.000000000 "scm_5" = 1.000000000 "scm_6" = 1.000000000 "scm_7" = 1.000000000 "scp_0" = 1.000000000 "scp_1" = 1.000000000 "scp_2" = 1.000000000 "scp_3" = 1.000000000 "scp_4" = 1.000000000 "scp_5" = 1.000000000 "scp_6" = 1.000000000 "scp_7" = 1.000000000 "scr_0" = 10.000000000 "scr_1" = 10.000000000 "scr_2" = 10.000000000 "scr_3" = 10.000000000 "scr_4" = 10.000000000 "scr_5" = 10.000000000 "scr_6" = 10.000000000 "scr_7" = 10.000000000 "scs_0" = 0.000000000 "scs_1" = 0.000000000 "scs_2" = 0.000000000 "scs_3" = 0.000000000 "scs_4" = 0.000000000 "scs_5" = 0.000000000 "scs_6" = 0.000000000 "scs_7" = 0.000000000 "sf_1" = 250.000000000 "sf_2" = 1250.000000000 "sf_3" = 5000.000000000 "sf_4" = 4000.000000000 "sf_5" = 8000.000000000 "sf_6" = 12000.000000000 "sf_7" = 16000.000000000 "sla_0" = 0.000000000 "sla_1" = 0.000000000 "sla_2" = 0.000000000 "sla_3" = 0.000000000 "sla_4" = 0.000000000 "sla_5" = 0.000000000 "sla_6" = 0.000000000 "sla_7" = 0.000000000 "sscs_0" = 0.000000000 "sscs_1" = 0.000000000 "sscs_2" = 0.000000000 "sscs_3" = 0.000000000 "sscs_4" = 0.000000000 "sscs_5" = 0.000000000 "sscs_6" = 0.000000000 "sscs_7" = 0.000000000 "ssplit" = 0.000000000 } }
          { type = lv2 name = stereo_tools plugin = "http://calf.sourceforge.net/plugins/StereoTools" label = stereo_tools
            control = { "balance_in" = 0.000000000 "balance_out" = 0.000000000 "delay" = 0.000000000 "mlev" = 1.000000000 "mode" = 0.000000000 "mpan" = 0.000000000 "mutel" = 0.000000000 "muter" = 0.000000000 "phasel" = 0.000000000 "phaser" = 0.000000000 "sbal" = 0.000000000 "sc_level" = 1.000000000 "slev" = 1.000000000 "softclip" = 0.000000000 "stereo_base" = 0.300000000 "stereo_phase" = 0.000000000 } }
          { type = builtin name = limiter_ig_l label = linear control = { "Mult" = 1.995262315 } }
          { type = builtin name = limiter_ig_r label = linear control = { "Mult" = 1.995262315 } }
          { type = lv2 name = limiter plugin = "http://lsp-plug.in/plugins/lv2/sc_limiter_stereo" label = limiter
            control = { "alr" = 0.000000000 "alr_at" = 5.000000000 "alr_rt" = 50.000000000 "at" = 2.000000000 "boost" = 0.000000000 "dith" = 0.000000000 "extsc" = 0.000000000 "in2lk" = 1.000000000 "in2sc" = 1.000000000 "knee" = 1.000000000 "lk" = 4.000000000 "lk2in" = 1.000000000 "lk2sc" = 1.000000000 "mode" = 0.000000000 "ovs" = 6.000000000 "rt" = 8.000000000 "sc2in" = 1.000000000 "sc2lk" = 1.000000000 "scp" = 1.000000000 "slink" = 100.000000000 "smooth" = -5.000000000 "th" = 1.000000000 } }
        ]
        links = [
          { output = "filter:out_l" input = "zero:In" }
          { output = "filter:out_l" input = "bass_enhancer_ig_l:In" }
          { output = "filter:out_r" input = "bass_enhancer_ig_r:In" }
          { output = "bass_enhancer_ig_l:Out" input = "bass_enhancer:in_l" }
          { output = "bass_enhancer_ig_r:Out" input = "bass_enhancer:in_r" }
          { output = "bass_enhancer:out_l" input = "multiband_compressor:in_l" }
          { output = "bass_enhancer:out_r" input = "multiband_compressor:in_r" }
          { output = "zero:Out" input = "multiband_compressor:sc_l" }
          { output = "zero:Out" input = "multiband_compressor:sc_r" }
          { output = "multiband_compressor:out_l" input = "stereo_tools:in_l" }
          { output = "multiband_compressor:out_r" input = "stereo_tools:in_r" }
          { output = "stereo_tools:out_l" input = "limiter_ig_l:In" }
          { output = "stereo_tools:out_r" input = "limiter_ig_r:In" }
          { output = "limiter_ig_l:Out" input = "limiter:in_l" }
          { output = "limiter_ig_r:Out" input = "limiter:in_r" }
          { output = "zero:Out" input = "limiter:sc_l" }
          { output = "zero:Out" input = "limiter:sc_r" }
        ]
        inputs  = [ "filter:in_l" "filter:in_r" ]
        outputs = [ "limiter:out_l" "limiter:out_r" ]
      }
      audio.channels = 2
      audio.position = [ FL FR ]

      # Smart filter: WirePlumber reads these off the main (Audio/Sink) node and
      # splices the chain in front of the speaker sink only, so headphones and
      # USB DACs stay untouched. Same mechanism EasyEffects used.
      capture.props = {
        node.name           = "effect_input.thinkpad-unsuck"
        media.class         = Audio/Sink
        node.link-group     = thinkpad-unsuck
        filter.smart        = true
        filter.smart.name   = thinkpad-unsuck
        filter.smart.target = { node.name = "alsa_output.pci-0000_c4_00.6.HiFi__Speaker__sink" }
      }
      playback.props = {
        node.name       = "effect_output.thinkpad-unsuck"
        node.link-group = thinkpad-unsuck
        node.passive    = true
      }
    }
  }
]