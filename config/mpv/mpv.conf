# The sway rule sizes mpv to 70ppt and centres it. mpv then overrides the
# height to match the media's aspect (a .flac's cover art is usually square),
# growing downward from an already-centred top edge and pushing the OSC
# controls off screen. Let sway own the window box; the video still keeps its
# own aspect inside it via `keepaspect`.
keepaspect-window=no
